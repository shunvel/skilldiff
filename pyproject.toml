[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skilldiff"
version = "0.1.0"
description = "A/B test AI agent skills, prompts, and tool definitions with LLM-as-a-Judge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "shunvel", email = "shunvel@gmail.com" }]
keywords = ["ai", "agents", "evals", "llm-as-a-judge", "cli", "gemini", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "google-genai>=0.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "certifi>=2024.0.0",
]

[project.scripts]
skilldiff = "skilldiff.main:app"

[project.urls]
Homepage = "https://github.com/shunvel/skilldiff"
Repository = "https://github.com/shunvel/skilldiff"
Issues = "https://github.com/shunvel/skilldiff/issues"
Changelog = "https://github.com/shunvel/skilldiff/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["skilldiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
packages = ["skilldiff"]
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["google.*", "google.genai.*"]
ignore_missing_imports = true
ignore_errors = true
