[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skilldiff"
version = "0.1.0"
description = "A/B test AI agent skills, prompts, and tool definitions with LLM-as-a-Judge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "shunvel", email = "shunvel@gmail.com" }]
keywords = ["ai", "agents", "testing", "cli", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "google-genai>=0.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "certifi>=2024.0.0",
]

[project.scripts]
skilldiff = "skilldiff.main:app"

[project.urls]
Homepage = "https://github.com/shunvel/skilldiff"
Repository = "https://github.com/shunvel/skilldiff"
Issues = "https://github.com/shunvel/skilldiff/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["skilldiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
