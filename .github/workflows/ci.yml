name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check skilldiff tests examples fixtures
      - run: ruff format --check skilldiff tests examples fixtures
      - run: mypy

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Run pytest
        run: |
          set +e
          python -m pytest -vv --tb=short | tee pytest.log
          status=${PIPESTATUS[0]}
          {
            echo "## Pytest (Python ${{ matrix.python-version }})"
            echo
            echo '```'
            cat pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            python -c 'from pathlib import Path; text=Path("pytest.log").read_text(errors="replace")[-4000:]; print("::error title=pytest failed::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$status"
      - run: python -m skilldiff demo
